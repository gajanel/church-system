# ============================================================
# nginx.conf — Reverse Proxy para Sistema de Iglesia
# Ubicación: /etc/nginx/sites-available/church-system
# Activar: sudo ln -s /etc/nginx/sites-available/church-system /etc/nginx/sites-enabled/
# ============================================================

# Redirige todo HTTP → HTTPS
server {
    listen 80;
    server_name tudominio.com www.tudominio.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tudominio.com www.tudominio.com;

    # ── Certificados TLS (Let's Encrypt) ─────────────────────────
    ssl_certificate     /etc/letsencrypt/live/tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tudominio.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Headers de seguridad ─────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    nosniff always;
    add_header X-Frame-Options           DENY always;
    add_header X-XSS-Protection         "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ── Tamaños máximos ──────────────────────────────────────────
    client_max_body_size 10M;

    # ── Frontend React (archivos estáticos construidos) ──────────
    root /var/www/church-system/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;   # React Router SPA fallback
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Assets con hash — se pueden cachear por mucho tiempo
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Backend FastAPI ──────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering    on;
    }

    # WebSocket (para anuncios en tiempo real)
    location /ws/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
    }

    # Logs
    access_log /var/log/nginx/church-system.access.log;
    error_log  /var/log/nginx/church-system.error.log;
}
